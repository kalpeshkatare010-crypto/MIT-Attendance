<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIT Attendance – Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#053F4D}a:hover{color:#021F26}
input::placeholder{color:#6B8A92}
input:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #053F4D; font-family: 'Inter Tight', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 48px 24px 28px; display: flex; flex-direction: column; gap: 20px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="#FFFFFF"></rect><path d="M9.5 16.5l4.5 4.5 8.5-9.5" fill="none" stroke="#DD7945" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px">MIT Attendance</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.05">Welcome back</h1>
      <p style="margin: 0; font-size: 15px; color: #B9D3D9">Log in with your ERP email ID and password.</p>
    </div>
  </div>

  <form style="flex: 1; background: #FFFFFF; color: #053F4D; border-radius: 28px 28px 0 0; padding: 28px 22px 22px; display: flex; flex-direction: column; gap: 18px; margin: 0">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="erp-id" style="font-size: 14px; font-weight: 700">Email ID</label>
      <div style="height: 56px; border: 2px solid #053F4D; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3E6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M4 7l8 6 8-6"></path></svg>
        <input id="erp-id" type="email" autocomplete="username" placeholder="Your ERP email ID" style="flex: 1; border: 0; background: transparent; font: 500 16px 'Inter Tight', sans-serif; color: #053F4D; height: 52px">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="erp-pass" style="font-size: 14px; font-weight: 700">Password</label>
      <div style="height: 56px; border: 1.5px solid #B9D3D9; border-radius: 16px; background: #E8F0F2; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3E6470" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"></rect><path d="M8 10V7a4 4 0 018 0v3"></path></svg>
        <input id="erp-pass" type="password" autocomplete="current-password" placeholder="Your ERP password" style="flex: 1; border: 0; background: transparent; font: 500 16px 'Inter Tight', sans-serif; color: #053F4D; height: 52px">
        <button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; color: #3E6470; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <label for="remember" style="display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 44px">
        <input id="remember" type="checkbox" checked style="width: 20px; height: 20px; accent-color: #053F4D; margin: 0">
        Keep me logged in
      </label>
      <a href="#" style="font-size: 15px; font-weight: 700">Forgot password?</a>
    </div>

    <a href="Otp.dc.html" style="height: 56px; border-radius: 16px; background: #DD7945; color: #021F26; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; margin-top: 6px">Log in</a>

    <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="width: 100%; background: #E8F0F2; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#053F4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
        <span style="font-size: 14px; color: #35606B; line-height: 1.4">Your details go straight to erp.mit.asia. The app shows only your attendance.</span>
      </div>
      <span style="font-size: 13px; color: #35606B">Developed by <b style="color: #053F4D">Kalpesh Katare</b></span>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
