<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIT Attendance – Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#DD7945}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #053F4D; font-family: 'Inter Tight', system-ui, sans-serif; color: #FFFFFF; padding: 52px 24px 28px; display: flex; flex-direction: column; overflow: hidden">
  <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="#FFFFFF"></rect><path d="M9.5 16.5l4.5 4.5 8.5-9.5" fill="none" stroke="#DD7945" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 18px">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px">Your settings</h1>
    <a href="Today.dc.html" aria-label="Close" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: flex-end"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16"></path></svg></a>
  </div>
  <p style="margin: 6px 0 14px; font-size: 15px; color: #B9D3D9">ERP account, target and alerts</p>

  <div style="display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <button type="button" style="display: flex; align-items: center; gap: 12px; background: transparent; border: 0; border-bottom: 1px solid #1A5868; color: #FFFFFF; padding: 13px 0; text-align: left; font-family: inherit; min-height: 64px">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 18px; font-weight: 600">{{r.title}}</span>
          <span style="font-size: 14px; color: #A9C8CF">{{r.sub}}</span>
        </span>
        <span style="font-size: 15px; font-weight: 700; color: #DD7945">{{r.value}}</span>
        <svg width="9" height="15" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l6 6-6 6"></path></svg>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px; align-items: center">
    <button type="button" style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: #DD7945; color: #021F26; font: 700 17px 'Inter Tight', sans-serif">Log out</button>
    <span style="font-size: 13px; color: #A9C8CF">MIT Attendance · v1.0</span>
    <span style="font-size: 13px; color: #A9C8CF">Developed by <b style="color: #FFFFFF">Kalpesh Katare</b></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { title: 'ERP account', sub: 'Logged in with your ERP email', value: '' },
        { title: 'Target attendance', sub: 'Subjects below this are flagged', value: '75%' },
        { title: 'Auto refresh', sub: 'Fetch new attendance from ERP', value: 'Hourly' },
        { title: 'Alerts', sub: 'When a subject drops below target', value: 'On' },
        { title: 'Privacy', sub: 'Password kept in phone’s secure storage', value: '' }
      ]
    };
  }
}
</script>
</body>
</html>
