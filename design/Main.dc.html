<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F0F2; font-family: 'Inter Tight', system-ui, sans-serif; color: #053F4D; padding: 56px 28px 28px; display: flex; flex-direction: column; align-items: center; gap: 26px">
  <div style="display: flex; align-items: center; gap: 10px">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="#053F4D"></rect><path d="M9.5 16.5l4.5 4.5 8.5-9.5" fill="none" stroke="#DD7945" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>

  </div>

  <div style="width: 100%; height: 240px; border-radius: 32px; background: #053F4D; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">

      <g fill="none" stroke="#1C5C6C" stroke-width="1.2">
        <circle cx="0" cy="0" r="40"></circle><circle cx="0" cy="0" r="70"></circle><circle cx="0" cy="0" r="100"></circle><circle cx="0" cy="0" r="130"></circle>

      </g>
    </svg>
    <svg width="150" height="150" viewBox="0 0 150 150" style="position: relative" role="img" aria-label="Attendance ring at 75 percent">
      <circle cx="75" cy="75" r="60" fill="none" stroke="#0B5163" stroke-width="14"></circle>
      <circle cx="75" cy="75" r="60" fill="none" stroke="#DD7945" stroke-width="14" stroke-linecap="round" stroke-dasharray="283 377" transform="rotate(-90 75 75)"></circle>
      <text x="75" y="82" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">75%</text>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <span style="font-size: 13px; font-weight: 600; background: #FFFFFF; border-radius: 99px; padding: 6px 14px">For students of MIT, Chh. Sambhajinagar</span>
    <h1 style="margin: 0; font-size: 34px; line-height: 1.08; font-weight: 800; letter-spacing: -0.8px; text-wrap: balance">Your ERP attendance, at a glance.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #35606B; max-width: 300px">Every subject's percentage in one place, with the ones below 75% flagged first.</p>
  </div>

  <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px">
    <a href="Connect.dc.html" style="width: 100%; height: 56px; border-radius: 16px; background: #053F4D; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Log in with ERP</a>
    <span style="font-size: 13px; color: #35606B">Developed by <b style="color: #053F4D">Kalpesh Katare</b></span>
