<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIT Attendance – Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#053F4D}a:hover{color:#021F26}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #053F4D; font-family: 'Inter Tight', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 22px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="#FFFFFF"></rect><path d="M9.5 16.5l4.5 4.5 8.5-9.5" fill="none" stroke="#DD7945" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #B9D3D9">Synced 2:36 PM
        <button type="button" aria-label="Refresh from ERP" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: flex-end; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"></path></svg></button>
      </div>
    </div>
    <h1 style="margin: 6px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px">Hi, Kalpesh!</h1>
    <p style="margin: 0; font-size: 15px; color: #B9D3D9">7 subjects this semester</p>
  </div>

  <div style="margin: 18px 22px 0; background: #FFFFFF; color: #053F4D; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 600; color: #3E6470">Average attendance</span>
        <span style="font-size: 46px; font-weight: 800; letter-spacing: -1.5px; line-height: 1">68.2%</span>
      </div>
      <span style="font-size: 14px; font-weight: 700; background: #DD7945; color: #021F26; border-radius: 99px; padding: 6px 12px; white-space: nowrap">3 below 75%</span>
    </div>
    <div style="position: relative; height: 10px; border-radius: 99px; background: #CFE0E4">
      <div style="width: 68.2%; height: 10px; border-radius: 99px; background: #DD7945"></div>
      <div style="position: absolute; left: 75%; top: -4px; width: 2px; height: 18px; background: #053F4D"></div>
    </div>
    <span style="font-size: 12px; color: #3E6470">Across the 5 subjects that have started · line marks 75%</span>
  </div>

  <div style="display: flex; align-items: center; gap: 6px; padding: 18px 22px 12px">
    <button type="button" style="height: 36px; padding: 0 16px; border: 0; border-radius: 10px; background: #DD7945; color: #021F26; font: 600 15px 'Inter Tight', sans-serif">At risk</button>
    <button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #FFFFFF; font: 500 15px 'Inter Tight', sans-serif">On track</button>
    <button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #FFFFFF; font: 500 15px 'Inter Tight', sans-serif">All</button>
  </div>

  <div style="flex: 1; background: #B9D3D9; border-radius: 28px 28px 0 0; padding: 14px; display: flex; flex-direction: column; gap: 8px; color: #053F4D">
    <sc-for list="{{risk}}" as="s" hint-placeholder-count="3">
      <a href="Subject.dc.html" style="background: #FFFFFF; border-radius: 18px; overflow: hidden; display: flex; text-decoration: none; color: #053F4D; min-height: 84px">
        <span style="width: 74px; flex: none; background: #DD7945; color: #021F26; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 21px; font-weight: 800; letter-spacing: -0.5px">{{s.pct}}</span>
          <span style="font-size: 11px; font-weight: 700">%</span>
        </span>
        <span style="flex: 1; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 3px">
          <span style="font-size: 15px; font-weight: 700; line-height: 1.25">{{s.name}}</span>
          <span style="font-size: 13px; color: #3E6470">{{s.meta}}</span>
        </span>
      </a>
    </sc-for>
    <div style="display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 12px 14px; background: repeating-linear-gradient(135deg, #CFE0E4 0 6px, #C3D8DD 6px 12px)">
      <span style="flex: 1; font-size: 14px; font-weight: 600">2 subjects haven't started yet</span>
      <span style="font-size: 13px; color: #35606B">Lab · Honour course</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      risk: [
        { pct: '50.0', name: 'Embedded System Application', meta: 'ECE311 · 10.3% of sessions done' },
        { pct: '62.5', name: 'Circular Economy & Plastic Waste Mgmt', meta: 'OEC341H · 82.1% of sessions done' },
        { pct: '63.6', name: 'Elastomer Technology Lab', meta: 'PPE 321 · 91.7% of sessions done' }
      ]
    };
  }
}
</script>
</body>
</html>
