<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIT Attendance – Subject detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#053F4D}a:hover{color:#021F26}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E8F0F2; font-family: 'Inter Tight', system-ui, sans-serif; color: #053F4D; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 48px 22px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Subjects.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <span style="font-size: 14px; font-weight: 700; background: #FFFFFF; border-radius: 99px; padding: 5px 12px">ECE311</span>
    </div>
    <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.05">Embedded System Application</h1>
    <p style="margin: 0; font-size: 15px; color: #35606B">Theory · 3.0 credits</p>
  </div>

  <div style="flex: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 22px 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 18px">
      <svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="50 percent attendance" style="flex: none">
        <circle cx="60" cy="60" r="48" fill="none" stroke="#CFE0E4" stroke-width="13"></circle>
        <circle cx="60" cy="60" r="48" fill="none" stroke="#DD7945" stroke-width="13" stroke-linecap="round" stroke-dasharray="150.8 302" transform="rotate(-90 60 60)"></circle>
        <text x="60" y="66" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="24" font-weight="800" fill="#053F4D">50.0%</text>
      </svg>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; font-weight: 600; color: #3E6470">Sessions done</span>
        <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.5px; line-height: 1">10.3%</span>
        <span style="height: 8px; border-radius: 99px; background: #CFE0E4; display: block"><span style="display: block; width: 10.3%; height: 8px; border-radius: 99px; background: #053F4D"></span></span>
      </div>
    </div>

    <div style="background: #DD7945; color: #021F26; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 17px; font-weight: 800">25 points below 75%</span>
      <span style="font-size: 14px; font-weight: 500; line-height: 1.4">Only 10.3% of sessions are done, so most of the course is still ahead. Attend regularly and this can recover.</span>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{info}}" as="i" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid #CFE0E4">
          <span style="width: 36px; height: 36px; border-radius: 12px; background: #E8F0F2; display: flex; align-items: center; justify-content: center; flex: none" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#053F4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{i.icon}}"></path></svg>
          </span>
          <span style="flex: 1; font-size: 14px; color: #3E6470">{{i.k}}</span>
          <span style="font-size: 15px; font-weight: 700; text-align: right">{{i.v}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="width: 100%; height: 56px; border: 0; border-radius: 16px; background: #053F4D; color: #FFFFFF; font: 700 17px 'Inter Tight', sans-serif">Refresh from ERP</button>
      <span style="font-size: 13px; color: #3E6470; text-align: center">Synced 2:36 PM</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      info: [
        { k: 'Faculty', v: 'Prof. Shailesh B. Biradar', icon: 'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6' },
        { k: 'Credits', v: '3.0', icon: 'M5 12l4 4 10-10' },
        { k: 'Next lecture', v: 'Not scheduled', icon: 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4' }
      ]
    };
  }
}
</script>
</body>
</html>
