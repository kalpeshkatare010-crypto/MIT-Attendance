<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIT Attendance – Subjects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#053F4D}a:hover{color:#021F26}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #053F4D; font-family: 'Inter Tight', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 22px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Today.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
      <span style="font-size: 14px; color: #B9D3D9">Target 75%</span>
    </div>
    <h1 style="margin: 4px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px">All subjects</h1>
    <p style="margin: 0; font-size: 15px; color: #B9D3D9">Lowest attendance first</p>
  </div>

  <div style="flex: 1; background: #B9D3D9; border-radius: 28px 28px 0 0; padding: 12px; display: flex; flex-direction: column; gap: 7px; color: #053F4D">
    <sc-for list="{{subjects}}" as="s" hint-placeholder-count="7">
      <a href="Subject.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; text-decoration: none; color: #053F4D">
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 14px; font-weight: 700; line-height: 1.2">{{s.name}}</span>
            <span style="font-size: 12px; color: #3E6470">{{s.code}} · {{s.credits}} credits</span>
          </span>
          <span style="{{s.pctStyle}}">{{s.pct}}</span>
        </span>
        <span style="display: flex; align-items: center; gap: 8px">
          <span style="flex: 1; position: relative; height: 6px; border-radius: 99px; background: #CFE0E4">
            <span style="{{s.barStyle}}"></span>
            <span style="position: absolute; left: 75%; top: -3px; width: 2px; height: 12px; background: #053F4D"></span>
          </span>
          <span style="font-size: 12px; color: #3E6470; white-space: nowrap">{{s.done}}</span>
        </span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      ['Embedded System Application', 'ECE311', '3.0', 50.0, 10.3],
      ['Circular Economy & Plastic Waste Mgmt', 'OEC341H', '3.0', 62.5, 82.1],
      ['Elastomer Technology Lab', 'PPE 321', '1.0', 63.6, 91.7],
      ['Elastomer Technology', 'PPE 301', '3.0', 81.5, 100],
      ['Fluid Mechanics', 'PPE 316A', '3.0', 83.3, 46.2],
      ['Embedded System Application Lab', 'ECE336', '1.0', null, 0],
      ['Industry Supported Honour Course', 'PPE 803', '4.0', null, null]
    ];
    var pill = 'font-size: 15px; font-weight: 800; border-radius: 10px; padding: 5px 9px; white-space: nowrap; ';
    return {
      subjects: rows.map(function (r) {
        var p = r[3];
        var low = p !== null && p < 75;
        return {
          name: r[0], code: r[1], credits: r[2],
          pct: p === null ? 'Not started' : p.toFixed(1) + '%',
          pctStyle: pill + (p === null ? 'font-size: 12px; font-weight: 700; border: 1.5px dashed #3E6470; color: #35606B;' : low ? 'background: #DD7945; color: #021F26;' : 'background: #053F4D; color: #FFFFFF;'),
          barStyle: 'display: block; height: 6px; border-radius: 99px; width: ' + (p || 0) + '%; background: ' + (low ? '#DD7945' : '#053F4D') + ';',
          done: r[4] === null ? 'Sessions —' : r[4] + '% done'
        };
      })
    };
  }
}
</script>
</body>
</html>
